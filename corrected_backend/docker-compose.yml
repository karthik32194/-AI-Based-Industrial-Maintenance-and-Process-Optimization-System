version: "3.9"

# ============================================================
# AI Maintenance & Optimization System — Docker Compose
# Services: backend API + PostgreSQL with pgvector
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL + pgvector
  # ----------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_maintenance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_maintenance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_maintenance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Backend API
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ai_maintenance_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/ai_maintenance_db
      SECRET_KEY: ${SECRET_KEY:-changeme-replace-with-strong-secret-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      # Mount ML models and knowledge data as persistent volumes
      - ml_models:/app/models
      - knowledge_data:/app/data/knowledge
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  ml_models:
  knowledge_data:
