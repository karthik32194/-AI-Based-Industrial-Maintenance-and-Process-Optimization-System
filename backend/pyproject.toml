[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-maintenance-backend"
version = "1.0.0"
description = "AI-Based Industrial Maintenance and Process Optimization System - Backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",

    # Validation
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "email-validator==2.2.0",

    # ORM & Database
    "sqlalchemy==2.0.31",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.2",

    # Authentication & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "bcrypt==4.1.3",

    # Data Processing & ML
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "joblib==1.4.2",

    # LLM & RAG
    "openai==1.35.13",
    "langchain==0.2.6",
    "langchain-openai==0.1.14",
    "langchain-community==0.2.6",
    "tiktoken==0.7.0",

    # Document loading
    "pypdf==4.2.0",
    "python-docx==1.1.2",

    # Logging & Observability
    "structlog==24.2.0",
    "python-json-logger==2.0.7",

    # Utilities
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "tenacity==8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==25.9.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
